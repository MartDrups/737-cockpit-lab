name: Check CBT question banks

on:
  push:
    branches: [feat/cbt-question-banks-20261030]
  workflow_run:
    workflows: [Publish 737 Cockpit Lab copy]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  questions:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check source question coverage and delivery
        run: |
          node tests/check-cbt-question-data.cjs
          sha256sum --check --quiet PUBLIC_SHA256SUMS
      - name: Install browser checks
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium webkit
      - name: Check grouped questions and completion
        env:
          CHECK_PUBLIC: ${{ github.event_name == 'workflow_run' || github.event_name == 'workflow_dispatch' }}
        run: |
          if [ "$CHECK_PUBLIC" = true ]; then
            python tests/check-cbt-question-banks.py --browser chromium --url https://martdrups.github.io/737-cockpit-lab/ --output artifacts/questions-chromium
            python tests/check-cbt-question-banks.py --browser webkit --url https://martdrups.github.io/737-cockpit-lab/ --output artifacts/questions-webkit
          else
            python tests/check-cbt-question-banks.py --browser chromium --output artifacts/questions-chromium
            python tests/check-cbt-question-banks.py --browser webkit --output artifacts/questions-webkit
          fi
      - name: Print verification reports
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          for report in Path('artifacts').glob('questions-*/questions.json'):
              print(report.parent.name, report.read_text())
          PY
      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cbt-question-bank-checks
          path: artifacts/questions-*
          retention-days: 7
