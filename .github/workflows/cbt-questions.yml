name: Check CBT question banks

on:
  push:
    branches: [feat/cbt-question-banks-20261030, cbt-fidelity-20261102]
  workflow_run:
    workflows: [Publish 737 Cockpit Lab copy]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  questions:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check source question coverage and delivery
        run: |
          node tests/check-cbt-question-data.cjs
          sha256sum --check --quiet PUBLIC_SHA256SUMS
      - name: Install browser checks
        run: |
          python -m pip install playwright pillow
          python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Check grouped questions and completion
        env:
          CHECK_PUBLIC: ${{ github.event_name == 'workflow_run' || github.event_name == 'workflow_dispatch' }}
        run: |
          if [ "$CHECK_PUBLIC" = true ]; then
            python tests/check-cbt-question-banks.py --browser ${{ matrix.browser }} --url https://martdrups.github.io/737-cockpit-lab/ --output artifacts/questions-${{ matrix.browser }}
          else
            python tests/check-cbt-question-banks.py --browser ${{ matrix.browser }} --output artifacts/questions-${{ matrix.browser }}
          fi
      - name: Print verification reports
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          for report in Path('artifacts').glob('questions-*/questions.json'):
              print(report.parent.name, report.read_text())
          PY
      - name: Check original movement geometry and pause
        run: python tests/check-cbt-fidelity.py --browser ${{ matrix.browser }} --output artifacts/fidelity-${{ matrix.browser }}
      - name: Compare every lossless movie frame
        run: python tests/check-cbt-movie-frames.py --browser ${{ matrix.browser }} --output artifacts/movie-frames-${{ matrix.browser }}
      - name: Decode and audit the complete CBT delivery
        if: matrix.browser == 'chromium'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          python scripts/audit-cbt.py --output artifacts/cbt-asset-audit
      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cbt-question-bank-checks-${{ matrix.browser }}
          path: |
            artifacts/questions-*
            artifacts/fidelity-*
            artifacts/movie-frames-*
            artifacts/cbt-asset-audit
          retention-days: 7
